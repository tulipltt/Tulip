[tools]
java = "corretto-21"
gradle = "latest"
maven = "latest"
scala-cli = "latest"
groovy = "latest"
kotlin = "latest"
jbang = "latest"

[settings]
experimental = true

[tasks.dependency-updates]
description = "Dump runtime dependencies and check for updates"
run = [
  "./gradlew :tulip-runtime:dependencies > deps.txt",
  "./gradlew dependencyUpdates --no-configuration-cache -Drevision=release --no-parallel",
]
run_windows = [
  "gradlew.bat :tulip-runtime:dependencies > deps.txt",
  "gradlew.bat dependencyUpdates --no-configuration-cache -Drevision=release --no-parallel",
]

[tasks.update-runtime]
dir = "reports"
run = [
  "jbang run python_jvm_tulip.java --keep-java report.py",
  "jbang run FileModifier.java report_py.java ../tulip-runtime/src/main/java/io/github/tulipltt/tulip/report/report_py.java",
]

[tasks.spotlessApply]
run = "./gradlew spotlessApply"
run_windows = "gradlew.bat spotlessApply"

[tasks.build-runtime]
run = "./gradlew :tulip-runtime:build"
run_windows = "gradlew.bat :tulip-runtime:build"

[tasks.publish-runtime]
run = "./gradlew :tulip-runtime:publishToMavenLocal"
run_windows = "gradlew.bat :tulip-runtime:publishToMavenLocal"

[tasks.list-jars-m2local]
run = "find ~/.m2 -name 'tulip-runtime*.jar' -print | sort"
run_windows = "cmd /c dir /s /b \"%USERPROFILE%\\.m2\\tulip-runtime*.jar\""

[tasks.delete-jars-m2local]
run = "rm -f -r ~/.m2/repository/io/github"
run_windows = "if exist \"%USERPROFILE%\\.m2\\repository\\io\\github\" rmdir /q /s \"%USERPROFILE%\\.m2\\repository\\io\\github\""

[tasks.publish-to-m2local]
run = [
  { task = "delete-jars-m2local" },
  { task = "update-runtime" },
  { task = "spotlessApply" },
  { task = "build-runtime" },
  { task = "publish-runtime" },
  { task = "list-jars-m2local" },
]

[tasks.run-bench]
description = ""
run = "./gradlew -q :tulip-main:run --args=\"--config benchmark_config.jsonc\""
run_windows = "gradlew.bat -q :tulip-main:run --args=\"--config benchmark_config.jsonc\""

[tasks.run-bench-hist]
description = ""
run = "./gradlew -q :tulip-main:run --args=\"--config benchmark_config_hist.jsonc\""
run_windows = "gradlew.bat -q :tulip-main:run --args=\"--config benchmark_config_hist.jsonc\""

[tasks.run-bench-test]
description = ""
run = "./gradlew -q :tulip-main:run --args=\"--config benchmark_config_test.jsonc\""
run_windows = "gradlew.bat -q :tulip-main:run --args=\"--config benchmark_config_test.jsonc\""

[tasks.upgrade-gradle]
# If you run: mise run upgrade-gradle 9.8.1
# It executes: ./gradlew wrapper --gradle-version 9.8.1
run = "./gradlew wrapper --gradle-version"

